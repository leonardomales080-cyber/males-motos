<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adquiere tu Moto | Males Motors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilo-vender.css">
    <link rel="icon" href="img/moto.venta1.avif" type="image/x-icon">
</head>1

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">MALES MOTORS</a>
            <a href="../index.html" class="btn btn-outline-light btn-sm">Volver al Inicio</a>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow border-0 p-4">
                    <h4 class="mb-4 fw-bold">Formulario de Cotización</h4>
                    <div id="mensajeExito" class="alert alert-success alert-dismissible fade show d-none" role="alert">
                        <strong><i class="bi bi-check-circle-fill"></i> ¡Solicitud enviada!</strong>
                        William Males se pondrá en contacto contigo muy pronto.
                        <button type="button" class="btn-close" data-bs-dismiss=\"alert\" aria-label=\"Close\"></button>
                    </div>
                    <form class="needs-validation" novalidate></form>
                    <form class="needs-validation" novalidate id="miFormulario">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Nombre Completo</label>
                                <input type="text" name="nombre" class="form-control" placeholder="Ej: Juan Pérez"
                                    required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Correo Electrónico</label>
                                <input type="email" name="email" class="form-control" placeholder="tu@correo.com"
                                    required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Selecciona la Moto de tu interés</label>
                            <select name="moto" class="form-select" required>
                                <option value="" selected disabled>Escoge un modelo...</option>
                                <option value="XR650">Adventure XR 650</option>
                                <option value="Supermoto">Supermoto Custom</option>
                                <option value="Scooter">Adventure Scooter</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mensaje o consulta adicional</label>
                            <textarea name="mensaje" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-warning fw-bold">Enviar Cotización a la
                                Empresa</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 text-muted border-top mt-5">
        <small>&copy; 2026 Males Motors - Atuntaqui, Ecuador</small>
    </footer>

    <script>
        // Seleccionamos el formulario y el mensaje
        const formulario = document.getElementById('miFormulario');
        const mensaje = document.getElementById('mensajeExito');

        formulario.addEventListener('submit', function (event) {
            // Detenemos el envío automático para procesar la validación
            event.preventDefault();

            if (!formulario.checkValidity()) {
                event.stopPropagation();
                formulario.classList.add('was-validated');
            } else {
                // MOSTRAR ALERTA: Quitamos la clase 'd-none' para que sea visible
                mensaje.classList.remove('d-none');

                // Limpiar el formulario
                formulario.reset();
                formulario.classList.remove('was-validated');

                // Subir la pantalla suavemente para ver el mensaje
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });
    </script>
</body>

</html>
